<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Last Day on Earth · Survival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0c0f0e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: pan-y; 
        }
        #game-wrapper {
            background: #1f2a24;
            border-radius: 32px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            width: fit-content;
            max-width: 98vw;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #3b4d3e;
            border-radius: 24px;
            box-shadow: inset 0 0 0 2px #5b6e5a, 0 10px 20px rgba(0,0,0,0.5);
            touch-action: none;
            cursor: crosshair;
            aspect-ratio: 16 / 9;
            max-width: 800px;
            margin: 0 auto;
        }
        #ui-overlay {
            display: none;
        }
        @media (orientation: landscape) {
            #game-wrapper {
                padding: 10px;
            }
        }
        @media (orientation: portrait) {
            body {
                background: #0a0d0b;
            }
            #game-wrapper {
                border-radius: 20px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>
<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800, H = 450;

        // -------- Глобальные состояния --------
        let gameState = 'loading'; // loading, menu, playing
        let loadingProgress = 0;

        // Игрок
        const player = {
            x: 400, y: 220,
            radius: 14,
            health: 100,
            maxHealth: 100,
            energy: 80,
            hunger: 70,
            thirst: 60,
            attackCooldown: 0,
            direction: 0, // radians
        };

        // Зомби (противники)
        let zombies = [];
        const MAX_ZOMBIES = 7;

        // Ресурсы / дроп
        let lootItems = [];

        // Управление (виртуальный джойстик)
        const joystick = {
            active: false,
            startX: 0, startY: 0,
            deltaX: 0, deltaY: 0,
            pointerId: null
        };

        // UI кнопки (как в Last Day on Earth)
        const buttons = {
            attack: { x: 680, y: 340, radius: 40, label: '⚔️' },
            loot:   { x: 590, y: 340, radius: 36, label: '📦' },
            craft:  { x: 500, y: 340, radius: 36, label: '🔧' },
            map:    { x: 60, y: 60, radius: 30, label: '🗺️' },
            menu:   { x: 140, y: 60, radius: 30, label: '☰' },
        };

        // Меню (состояние)
        let menuOpen = false;
        let showCraft = false;

        // Ресурсы игрока (инвентарь)
        let inventory = {
            wood: 12,
            stone: 8,
            scrap: 4,
            food: 3,
            water: 2,
        };

        // Таймеры
        let gameTick = 0;
        let hungerTimer = 0;
        let zombieSpawnTimer = 0;

        // -------- Загрузочный экран (имитация) --------
        function updateLoading() {
            loadingProgress += 0.8;
            if (loadingProgress >= 100) {
                loadingProgress = 100;
                gameState = 'menu';
            }
        }

        // -------- Спавн зомби --------
        function spawnZombie() {
            if (zombies.length >= MAX_ZOMBIES) return;
            let side = Math.floor(Math.random() * 4);
            let x, y;
            const pad = 40;
            switch(side) {
                case 0: x = pad; y = Math.random() * (H - pad*2) + pad; break;
                case 1: x = W - pad; y = Math.random() * (H - pad*2) + pad; break;
                case 2: x = Math.random() * (W - pad*2) + pad; y = pad; break;
                case 3: x = Math.random() * (W - pad*2) + pad; y = H - pad; break;
            }
            // Не спавнить прямо на игроке
            if (Math.hypot(x - player.x, y - player.y) < 80) return;

            zombies.push({
                x, y,
                radius: 16,
                health: 40 + Math.floor(Math.random() * 20),
                speed: 0.7 + Math.random() * 0.6,
                attackCooldown: 0,
                type: Math.random() > 0.7 ? 'runner' : 'walker',
                state: 'idle',
            });
        }

        // -------- Лут (дроп с зомби) --------
        function dropLoot(x, y) {
            const types = ['wood', 'stone', 'scrap', 'food', 'water'];
            const count = 1 + Math.floor(Math.random() * 2);
            for (let i=0; i<count; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                lootItems.push({
                    x: x + (Math.random() - 0.5) * 40,
                    y: y + (Math.random() - 0.5) * 40,
                    type: type,
                    radius: 10,
                    life: 600, // исчезнет через ~10 сек
                });
            }
        }

        // -------- Инициализация новой игры --------
        function initGame() {
            player.x = 400; player.y = 220;
            player.health = 100;
            player.energy = 80;
            player.hunger = 70;
            player.thirst = 60;
            player.attackCooldown = 0;
            zombies = [];
            lootItems = [];
            inventory = { wood: 12, stone: 8, scrap: 4, food: 3, water: 2 };
            menuOpen = false;
            showCraft = false;
            gameTick = 0;
            hungerTimer = 0;
            zombieSpawnTimer = 0;
            // начальные зомби
            for (let i=0; i<4; i++) spawnZombie();
        }

        // -------- Обработка ввода (мышь / тач) --------
        function handlePointerDown(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY, pointerId;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                pointerId = e.touches[0].identifier;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
                pointerId = 1;
            }
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            if (gameState === 'menu') {
                // клик по меню "Играть"
                if (canvasX > 300 && canvasX < 500 && canvasY > 200 && canvasY < 270) {
                    gameState = 'playing';
                    initGame();
                }
                return;
            }

            if (gameState === 'playing') {
                // Проверка кнопок (сначала меню/карта/крафт и т.д.)
                if (checkButtonHit(canvasX, canvasY, buttons.menu)) {
                    menuOpen = !menuOpen;
                    showCraft = false;
                    return;
                }
                if (checkButtonHit(canvasX, canvasY, buttons.map)) {
                    // имитация карты
                    return;
                }
                if (checkButtonHit(canvasX, canvasY, buttons.craft)) {
                    showCraft = !showCraft;
                    menuOpen = false;
                    return;
                }
                if (checkButtonHit(canvasX, canvasY, buttons.attack)) {
                    if (player.attackCooldown <= 0) {
                        attackNearby();
                        player.attackCooldown = 20;
                    }
                    return;
                }
                if (checkButtonHit(canvasX, canvasY, buttons.loot)) {
                    collectLoot();
                    return;
                }

                // Если меню открыто – клики по меню обрабатываем отдельно
                if (menuOpen) {
                    handleMenuClick(canvasX, canvasY);
                    return;
                }

                // Джойстик (движение) – если тап на левой половине
                if (canvasX < 400) {
                    joystick.active = true;
                    joystick.startX = canvasX;
                    joystick.startY = canvasY;
                    joystick.deltaX = 0;
                    joystick.deltaY = 0;
                    if (e.touches) {
                        joystick.pointerId = pointerId;
                    } else {
                        joystick.pointerId = 'mouse';
                    }
                }
            }
        }

        function handlePointerMove(e) {
            e.preventDefault();
            if (!joystick.active) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY, pointerId;
            if (e.touches) {
                // ищем нужный палец
                let found = false;
                for (let t of e.touches) {
                    if (t.identifier === joystick.pointerId) {
                        clientX = t.clientX;
                        clientY = t.clientY;
                        found = true;
                        break;
                    }
                }
                if (!found) return;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            let dx = canvasX - joystick.startX;
            let dy = canvasY - joystick.startY;
            const maxDist = 60;
            const dist = Math.hypot(dx, dy);
            if (dist > maxDist) {
                dx = dx / dist * maxDist;
                dy = dy / dist * maxDist;
            }
            joystick.deltaX = dx;
            joystick.deltaY = dy;
        }

        function handlePointerUp(e) {
            e.preventDefault();
            if (e.touches) {
                // если отпущен нужный палец
                if (joystick.pointerId !== null) {
                    let stillActive = false;
                    for (let t of e.touches) {
                        if (t.identifier === joystick.pointerId) stillActive = true;
                    }
                    if (!stillActive) {
                        joystick.active = false;
                        joystick.deltaX = 0;
                        joystick.deltaY = 0;
                        joystick.pointerId = null;
                    }
                }
            } else {
                joystick.active = false;
                joystick.deltaX = 0;
                joystick.deltaY = 0;
                joystick.pointerId = null;
            }
        }

        function checkButtonHit(cx, cy, btn) {
            const dx = cx - btn.x;
            const dy = cy - btn.y;
            return (dx*dx + dy*dy) < (btn.radius * btn.radius);
        }

        // -------- Обработка меню (крафт / инвентарь) --------
        function handleMenuClick(cx, cy) {
            // Крафт: кнопка "Сделать аптечку" (условно)
            if (showCraft) {
                if (cx > 300 && cx < 500 && cy > 180 && cy < 230) {
                    if (inventory.wood >= 3 && inventory.scrap >= 2) {
                        inventory.wood -= 3;
                        inventory.scrap -= 2;
                        player.health = Math.min(player.maxHealth, player.health + 25);
                    }
                }
                if (cx > 300 && cx < 500 && cy > 250 && cy < 300) {
                    if (inventory.food >= 1 && inventory.water >= 1) {
                        inventory.food -= 1;
                        inventory.water -= 1;
                        player.hunger = Math.min(100, player.hunger + 20);
                        player.thirst = Math.min(100, player.thirst + 20);
                    }
                }
                return;
            }
            // Инвентарь
            if (cx > 100 && cx < 300 && cy > 100 && cy < 180) {
                // использовать еду
                if (inventory.food > 0) {
                    inventory.food--;
                    player.hunger = Math.min(100, player.hunger + 15);
                    player.health = Math.min(player.maxHealth, player.health + 5);
                }
            }
            if (cx > 100 && cx < 300 && cy > 200 && cy < 280) {
                if (inventory.water > 0) {
                    inventory.water--;
                    player.thirst = Math.min(100, player.thirst + 15);
                }
            }
        }

        // -------- Атака ближайшего зомби --------
        function attackNearby() {
            let closest = null;
            let minDist = 70;
            for (let z of zombies) {
                const d = Math.hypot(z.x - player.x, z.y - player.y);
                if (d < minDist) {
                    minDist = d;
                    closest = z;
                }
            }
            if (closest) {
                closest.health -= 20 + Math.floor(Math.random() * 10);
                if (closest.health <= 0) {
                    const idx = zombies.indexOf(closest);
                    if (idx !== -1) {
                        dropLoot(closest.x, closest.y);
                        zombies.splice(idx, 1);
                    }
                }
            }
        }

        // -------- Сбор лута --------
        function collectLoot() {
            for (let i = lootItems.length - 1; i >= 0; i--) {
                const item = lootItems[i];
                const d = Math.hypot(item.x - player.x, item.y - player.y);
                if (d < 50) {
                    if (inventory.hasOwnProperty(item.type)) {
                        inventory[item.type] = (inventory[item.type] || 0) + 1;
                    }
                    lootItems.splice(i, 1);
                }
            }
        }

        // -------- Обновление игры --------
        function updateGame() {
            if (gameState !== 'playing') return;
            gameTick++;

            // Регенерация здоровья (медленная)
            if (gameTick % 30 === 0 && player.health < player.maxHealth && player.hunger > 20 && player.thirst > 20) {
                player.health = Math.min(player.maxHealth, player.health + 1);
            }

            // Голод/жажда
            if (gameTick % 120 === 0) {
                player.hunger = Math.max(0, player.hunger - 2);
                player.thirst = Math.max(0, player.thirst - 3);
                if (player.hunger === 0 || player.thirst === 0) {
                    player.health = Math.max(0, player.health - 2);
                }
            }

            // Движение игрока (джойстик)
            if (joystick.active) {
                const speed = 1.8;
                let dx = joystick.deltaX;
                let dy = joystick.deltaY;
                const len = Math.hypot(dx, dy);
                if (len > 5) {
                    const normX = dx / len;
                    const normY = dy / len;
                    player.x += normX * speed;
                    player.y += normY * speed;
                    player.direction = Math.atan2(dy, dx);
                    // ограничение
                    player.x = Math.max(20, Math.min(W - 20, player.x));
                    player.y = Math.max(20, Math.min(H - 20, player.y));
                }
            }

            // Кулдаун атаки
            if (player.attackCooldown > 0) player.attackCooldown--;

            // Зомби: AI
            for (let z of zombies) {
                const dx = player.x - z.x;
                const dy = player.y - z.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 200) {
                    const move = z.speed * (z.type === 'runner' ? 1.2 : 0.8);
                    z.x += (dx / dist) * move;
                    z.y += (dy / dist) * move;
                    // атака зомби
                    if (dist < 30 && z.attackCooldown <= 0) {
                        player.health -= 6 + Math.floor(Math.random() * 5);
                        z.attackCooldown = 40;
                    }
                }
                if (z.attackCooldown > 0) z.attackCooldown--;
                // ограничение
                z.x = Math.max(10, Math.min(W - 10, z.x));
                z.y = Math.max(10, Math.min(H - 10, z.y));
            }

            // Спавн зомби
            if (gameTick % 180 === 0 && zombies.length < MAX_ZOMBIES) {
                spawnZombie();
            }

            // Обновление лута (исчезновение)
            for (let i = lootItems.length - 1; i >= 0; i--) {
                lootItems[i].life--;
                if (lootItems[i].life <= 0) lootItems.splice(i, 1);
            }

            // Game Over
            if (player.health <= 0) {
                gameState = 'menu';
                menuOpen = false;
                showCraft = false;
            }
        }

        // -------- Отрисовка --------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            if (gameState === 'loading') {
                drawLoading();
                return;
            }

            if (gameState === 'menu') {
                drawMenu();
                return;
            }

            // ---- Игровой мир ----
            // Трава / текстура
            ctx.fillStyle = '#4d6b4a';
            ctx.fillRect(0, 0, W, H);
            for (let i=0; i<80; i++) {
                ctx.fillStyle = i%2===0 ? '#5b7a55' : '#3f5e3a';
                ctx.beginPath();
                ctx.arc(20 + (i%20)*40, 10 + Math.floor(i/20)*40, 6, 0, Math.PI*2);
                ctx.fill();
            }

            // Лут
            for (let item of lootItems) {
                ctx.fillStyle = '#f7d44a';
                ctx.shadowColor = '#dbb42c';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#3d2b1a';
                ctx.font = 'bold 12px sans-serif';
                ctx.shadowBlur = 0;
                ctx.fillText('📦', item.x-10, item.y+5);
            }
            ctx.shadowBlur = 0;

            // Зомби
            for (let z of zombies) {
                ctx.fillStyle = '#2a4a2a';
                ctx.shadowColor = '#1a2a1a';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#6a8a5a';
                ctx.shadowBlur = 0;
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('🧟', z.x-12, z.y+6);
                // полоска здоровья
                ctx.fillStyle = '#b33';
                ctx.fillRect(z.x-20, z.y-24, 40, 6);
                ctx.fillStyle = '#5c5';
                ctx.fillRect(z.x-20, z.y-24, (z.health/60)*40, 6);
            }

            // Игрок
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#1f3a1f';
            ctx.fillStyle = '#3e6b47';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#6a9a6a';
            ctx.shadowBlur = 0;
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('🧑', player.x-14, player.y+8);
            // полоска здоровья игрока
            ctx.fillStyle = '#222';
            ctx.fillRect(player.x-30, player.y-32, 60, 8);
            ctx.fillStyle = '#b33';
            ctx.fillRect(player.x-30, player.y-32, (player.health/player.maxHealth)*60, 8);

            // UI панель (статы)
            ctx.fillStyle = '#1f2a1fcc';
            ctx.shadowBlur = 0;
            ctx.fillRect(10, 10, 180, 70);
            ctx.fillStyle = '#ddd';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`❤️ ${player.health}  🍖 ${player.hunger}  💧 ${player.thirst}`, 20, 32);
            ctx.fillText(`⚡ ${player.energy}  🪵 ${inventory.wood}  🪨 ${inventory.stone}`, 20, 54);

            // Кнопки (как в Last Day)
            drawButton(buttons.attack);
            drawButton(buttons.loot);
            drawButton(buttons.craft);
            drawButton(buttons.map);
            drawButton(buttons.menu);

            // Джойстик (визуал)
            if (joystick.active) {
                ctx.strokeStyle = '#ffffff66';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 30, 0, Math.PI*2);
                ctx.stroke();
                ctx.fillStyle = '#ffffff55';
                ctx.beginPath();
                ctx.arc(joystick.startX + joystick.deltaX, joystick.startY + joystick.deltaY, 16, 0, Math.PI*2);
                ctx.fill();
            }

            // Меню / крафт
            if (menuOpen) drawMenuPanel();
            if (showCraft) drawCraftPanel();
        }

        // Вспомогательные функции отрисовки
        function drawButton(btn) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00000066';
            ctx.fillStyle = '#2f3f2fcc';
            ctx.beginPath();
            ctx.arc(btn.x, btn.y, btn.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#7a9a7a';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#f0f0e0';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(btn.label, btn.x, btn.y+2);
        }

        function drawMenuPanel() {
            ctx.fillStyle = '#1a2a1acc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#000000aa';
            ctx.fillRect(60, 80, 260, 280);
            ctx.strokeStyle = '#6a8a5a';
            ctx.lineWidth = 3;
            ctx.strokeRect(60, 80, 260, 280);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#e0e8d0';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('📦 ИНВЕНТАРЬ', 100, 115);
            ctx.font = '16px sans-serif';
            ctx.fillText(`🪵 ${inventory.wood}  🪨 ${inventory.stone}  🔩 ${inventory.scrap}`, 80, 150);
            ctx.fillText(`🍖 ${inventory.food}  💧 ${inventory.water}`, 80, 180);
            ctx.fillStyle = '#b8c8a8';
            ctx.font = '14px sans-serif';
            ctx.fillText('[ Использовать еду ]', 90, 215);
            ctx.fillText('[ Использовать воду ]', 90, 260);
            ctx.fillStyle = '#cdd8c0';
            ctx.font = '12px sans-serif';
            ctx.fillText('Нажмите на строку', 100, 300);
        }

        function drawCraftPanel() {
            ctx.fillStyle = '#1a2a1acc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#000000aa';
            ctx.fillRect(300, 80, 260, 260);
            ctx.strokeStyle = '#6a8a5a';
            ctx.lineWidth = 3;
            ctx.strokeRect(300, 80, 260, 260);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#e0e8d0';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('🔧 КРАФТ', 340, 115);
            ctx.font = '14px sans-serif';
            ctx.fillStyle = '#c8d8b8';
            ctx.fillText('Аптечка (3 дерева + 2 металла)', 320, 165);
            ctx.fillText('▶ Сделать', 340, 205);
            ctx.fillText('Еда+вода (1 + 1)', 340, 255);
            ctx.fillText('▶ Приготовить', 340, 290);
        }

        function drawLoading() {
            ctx.fillStyle = '#1f2a1f';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#8a9a7a';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('LAST DAY ON EARTH', W/2, 150);
            ctx.fillStyle = '#c8d8b0';
            ctx.font = '20px sans-serif';
            ctx.fillText('SURVIVAL', W/2, 200);
            ctx.fillStyle = '#5a7a4a';
            ctx.fillRect(W/2-120, 250, 240, 20);
            ctx.fillStyle = '#8aba6a';
            ctx.fillRect(W/2-120, 250, (loadingProgress/100)*240, 20);
            ctx.fillStyle = '#ddd';
            ctx.font = '16px sans-serif';
            ctx.fillText('Загрузка...', W/2, 290);
        }

        function drawMenu() {
            ctx.fillStyle = '#1f2a1f';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#8a9a7a';
            ctx.font = 'bold 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⚔️ ВЫЖИВАНИЕ', W/2, 130);
            ctx.font = '22px sans-serif';
            ctx.fillStyle = '#b0c8a0';
            ctx.fillText('Last Day on Earth', W/2, 180);
            // Кнопка играть
            ctx.fillStyle = '#4a6a3a';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00000077';
            ctx.beginPath();
            ctx.roundRect(300, 200, 200, 60, 16);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#f0f8e0';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('▶ ИГРАТЬ', W/2, 240);
            ctx.fillStyle = '#7a8a6a';
            ctx.font = '16px sans-serif';
            ctx.fillText('v1.0 · мобильная версия', W/2, 310);
        }

        // -------- Цикл --------
        function gameLoop() {
            if (gameState === 'loading') updateLoading();
            if (gameState === 'playing') updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Полифилл roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // -------- События --------
        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp, { passive: false });
        window.addEventListener('touchcancel', handlePointerUp, { passive: false });

        // Старт
        gameLoop();
    })();
</script>
</body>
</html>
