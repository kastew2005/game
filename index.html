<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Knife Hit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: block;
            background: radial-gradient(ellipse at center, #2a2a4a 0%, #1a1a2e 100%);
            touch-action: none;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            cursor: crosshair;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #message {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            cursor: pointer;
        }
        #message.show {
            opacity: 1;
        }
        @media (max-width: 500px) {
            #message {
                font-size: 1.2rem;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
        <div id="message"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('message');

        // === Адаптивный размер ===
        function resizeCanvas() {
            const maxW = window.innerWidth * 0.95;
            const maxH = window.innerHeight * 0.95;
            const ratio = 4/3;
            
            let w = maxW;
            let h = w / ratio;
            if (h > maxH) {
                h = maxH;
                w = h * ratio;
            }
            
            canvas.width = Math.floor(w);
            canvas.height = Math.floor(h);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const W = () => canvas.width;
        const H = () => canvas.height;

        // === Параметры ===
        const MAX_KNIVES = 12;
        let LOG_RADIUS = () => Math.min(W(), H()) / 4.2;
        let LOG_CENTER = () => ({ x: W()/2, y: H()/2 + H()/15 });

        let angle = 0;
        const ROTATION_SPEED = 0.025;
        const KNIFE_SPEED = 0.045;
        
        let knives_on_log = [];
        let flying_knife = null;
        let score = 0;
        let combo = 0;
        let gameOver = false;
        let victory = false;
        let particles = [];
        let stars = [];
        let lastHitTime = 0;
        let messageTimeout = null;
        
        // === Прицел ===
        let aimAngle = 0;
        let aimDistance = 0;
        let aimVisible = true;

        // === Звезды ===
        function initStars() {
            stars = [];
            for (let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * W(),
                    y: Math.random() * H() * 0.6,
                    r: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.5 + 0.3,
                    speed: Math.random() * 0.02 + 0.01
                });
            }
        }
        initStars();

        // === Генерация безопасного угла ===
        function getSafeAngle() {
            for (let attempt = 0; attempt < 100; attempt++) {
                const newAngle = Math.random() * Math.PI * 2;
                let safe = true;
                for (const k of knives_on_log) {
                    let diff = Math.abs(k - newAngle);
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;
                    if (diff < 0.35) {
                        safe = false;
                        break;
                    }
                }
                if (safe) return newAngle;
            }
            return Math.random() * Math.PI * 2;
        }

        // === Частицы ===
        function addParticles(x, y, count = 20, color = [255, 200, 100]) {
            for (let i = 0; i < count; i++) {
                const speed = Math.random() * 4 + 1;
                const angle = Math.random() * Math.PI * 2;
                particles.push({
                    x, y,
                    vx: speed * Math.cos(angle),
                    vy: speed * Math.sin(angle) - 1,
                    life: Math.random() * 30 + 20,
                    maxLife: 50,
                    size: Math.random() * 4 + 2,
                    color: [
                        color[0] + (Math.random() - 0.5) * 40,
                        color[1] + (Math.random() - 0.5) * 40,
                        color[2] + (Math.random() - 0.5) * 40
                    ]
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = `rgb(${p.color[0]}, ${p.color[1]}, ${p.color[2]})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // === Отрисовка ===
        function drawBackground() {
            // Градиент
            const grad = ctx.createRadialGradient(W()/2, H()/2, 0, W()/2, H()/2, W());
            grad.addColorStop(0, '#2a2a4a');
            grad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W(), H());
            
            // Звезды
            for (const star of stars) {
                star.alpha += Math.sin(Date.now() * star.speed) * 0.005;
                star.alpha = Math.max(0.2, Math.min(0.8, star.alpha));
                ctx.globalAlpha = star.alpha;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawLog() {
            const center = LOG_CENTER();
            const radius = LOG_RADIUS();
            const shadowOff = radius / 20;

            // Тень
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = shadowOff;
            ctx.shadowOffsetY = shadowOff;
            
            // Основной круг (градиент)
            const grad = ctx.createRadialGradient(
                center.x - radius/3, center.y - radius/3, radius/10,
                center.x, center.y, radius
            );
            grad.addColorStop(0, '#e8d5a8');
            grad.addColorStop(0.4, '#d4b88a');
            grad.addColorStop(0.8, '#b8956a');
            grad.addColorStop(1, '#8a6d4a');
            
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Годовые кольца
            for (let r = 20; r < radius; r += 18) {
                ctx.strokeStyle = `rgba(140, 100, 70, ${0.15 + 0.15 * (r / radius)})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Центр
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.fillStyle = '#c4a070';
            ctx.beginPath();
            ctx.arc(center.x, center.y, radius/12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#8a6d4a';
            ctx.beginPath();
            ctx.arc(center.x, center.y, radius/25, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Блик
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(center.x - radius*0.3, center.y - radius*0.35, radius*0.15, radius*0.08, -0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // === Отрисовка прицела ===
        function drawAim() {
            if (gameOver || victory || flying_knife) return;
            
            const center = LOG_CENTER();
            const radius = LOG_RADIUS();
            
            // Получаем безопасный угол для прицела
            const safeAngle = getSafeAngle();
            const currentAngle = safeAngle + angle;
            
            // Позиция ножа на окружности
            const dist = radius + 30;
            const x = center.x + dist * Math.cos(currentAngle);
            const y = center.y + dist * Math.sin(currentAngle);
            
            // Направление к центру
            const dx = Math.cos(currentAngle);
            const dy = Math.sin(currentAngle);
            
            // === Линия траектории ===
            ctx.save();
            
            // Пунктирная линия от ножа до бревна
            ctx.setLineDash([6, 8]);
            ctx.lineDashOffset = -Date.now() / 50;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            const endX = center.x + (radius + 2) * Math.cos(currentAngle);
            const endY = center.y + (radius + 2) * Math.sin(currentAngle);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // === Вращающийся маркер ===
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            
            // Внешнее свечение
            const glow = ctx.createRadialGradient(x, y, 0, x, y, 20 * pulse);
            glow.addColorStop(0, 'rgba(255, 255, 100, 0.2)');
            glow.addColorStop(1, 'rgba(255, 255, 100, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, 20 * pulse, 0, Math.PI * 2);
            ctx.fill();
            
            // Основной круг
            ctx.shadowColor = 'rgba(255, 255, 100, 0.5)';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = `rgba(255, 255, 100, ${0.5 * pulse})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x, y, 12 * pulse, 0, Math.PI * 2);
            ctx.stroke();
            
            // Внутренний круг
            ctx.shadowBlur = 10;
            ctx.fillStyle = `rgba(255, 255, 100, ${0.3 * pulse})`;
            ctx.beginPath();
            ctx.arc(x, y, 6 * pulse, 0, Math.PI * 2);
            ctx.fill();
            
            // Крестик
            ctx.shadowBlur = 15;
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.7 * pulse})`;
            ctx.lineWidth = 2;
            const crossSize = 8 * pulse;
            ctx.beginPath();
            ctx.moveTo(x - crossSize, y);
            ctx.lineTo(x + crossSize, y);
            ctx.moveTo(x, y - crossSize);
            ctx.lineTo(x, y + crossSize);
            ctx.stroke();
            
            // Точка в центре
            ctx.shadowBlur = 10;
            ctx.fillStyle = `rgba(255, 255, 255, ${0.8 * pulse})`;
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Маленький нож-индикатор
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(255,255,100,0.3)';
            ctx.strokeStyle = `rgba(255, 255, 200, ${0.5 * pulse})`;
            ctx.lineWidth = 2.5;
            const bladeLen = 10;
            const handleLen = 6;
            ctx.beginPath();
            ctx.moveTo(x - handleLen * dx, y - handleLen * dy);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.strokeStyle = `rgba(255, 200, 150, ${0.6 * pulse})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + bladeLen * dx, y + bladeLen * dy);
            ctx.stroke();
            
            ctx.restore();
        }

        function drawKnife(angle_rad, isFlying = false, flash = false) {
            const center = LOG_CENTER();
            const radius = LOG_RADIUS();
            const bladeLen = radius / 5;
            const handleLen = bladeLen / 2.5;
            
            const x = center.x + (radius + 5) * Math.cos(angle_rad);
            const y = center.y + (radius + 5) * Math.sin(angle_rad);
            
            const dx = Math.cos(angle_rad);
            const dy = Math.sin(angle_rad);

            ctx.save();

            // Тень
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // Ручка
            ctx.shadowBlur = 5;
            ctx.strokeStyle = '#5a3d2b';
            ctx.lineWidth = Math.max(4, bladeLen / 6);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - handleLen * dx, y - handleLen * dy);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Лезвие
            ctx.shadowBlur = 12;
            if (isFlying) {
                const glow = ctx.createRadialGradient(x, y, 0, x, y, bladeLen);
                glow.addColorStop(0, 'rgba(255,100,50,0.3)');
                glow.addColorStop(1, 'rgba(255,100,50,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, bladeLen, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#ff4444';
                ctx.shadowColor = 'rgba(255,50,50,0.6)';
                ctx.shadowBlur = 20;
            } else if (flash) {
                ctx.strokeStyle = '#ffd700';
                ctx.shadowColor = 'rgba(255,215,0,0.8)';
                ctx.shadowBlur = 25;
            } else {
                const grad = ctx.createLinearGradient(x, y, x + bladeLen * dx, y + bladeLen * dy);
                grad.addColorStop(0, '#c0c0d0');
                grad.addColorStop(0.5, '#e8e8f0');
                grad.addColorStop(1, '#ffffff');
                ctx.strokeStyle = grad;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;
            }
            
            ctx.lineWidth = Math.max(3, bladeLen / 7);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + bladeLen * dx, y + bladeLen * dy);
            ctx.stroke();

            // Блик на лезвии
            if (!isFlying && !flash) {
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.4;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 3 * dx, y + 3 * dy);
                ctx.lineTo(x + (bladeLen - 4) * dx, y + (bladeLen - 4) * dy);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        function drawFlyingKnife(startAngle, progress) {
            const center = LOG_CENTER();
            const radius = LOG_RADIUS();
            const currentAngle = startAngle + angle;
            const dist = radius + 40 + (radius - 10) * (1 - progress);
            
            const x = center.x + dist * Math.cos(currentAngle);
            const y = center.y + dist * Math.sin(currentAngle);
            const dx = Math.cos(currentAngle);
            const dy = Math.sin(currentAngle);

            // След
            for (let i = 1; i <= 8; i++) {
                const alpha = 0.08 - i * 0.008;
                if (alpha <= 0) break;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ff8844';
                ctx.beginPath();
                ctx.arc(x - i * 6 * dx, y - i * 6 * dy, 4 - i * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Рисуем нож
            const bladeLen = radius / 5;
            const handleLen = bladeLen / 2.5;
            
            ctx.save();
            
            ctx.shadowColor = 'rgba(255,50,50,0.3)';
            ctx.shadowBlur = 30;
            
            ctx.shadowBlur = 10;
            ctx.strokeStyle = '#5a3d2b';
            ctx.lineWidth = Math.max(4, bladeLen / 6);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - handleLen * dx, y - handleLen * dy);
            ctx.lineTo(x, y);
            ctx.stroke();

            ctx.shadowColor = 'rgba(255,50,50,0.8)';
            ctx.shadowBlur = 35;
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = Math.max(3, bladeLen / 7);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + bladeLen * dx, y + bladeLen * dy);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.6;
            ctx.strokeStyle = '#ffaa77';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 3 * dx, y + 3 * dy);
            ctx.lineTo(x + (bladeLen - 3) * dx, y + (bladeLen - 3) * dy);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function drawUI() {
            const radius = LOG_RADIUS();

            // Полупрозрачный фон
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.roundRect(10, 10, W() - 20, 50, 15);
            ctx.fill();

            // Счет
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.max(20, radius/4)}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText(`${score}/${MAX_KNIVES}`, W()/2, 35);

            // Иконки ножей
            const maxShow = Math.min(score, MAX_KNIVES);
            const startX = 25;
            const iconSize = Math.max(12, radius/10);
            for (let i = 0; i < maxShow; i++) {
                const x = startX + i * (iconSize + 3);
                if (x > W() - 20) break;
                const y = 30;
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(255,215,0,0.3)';
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + iconSize/2, y - iconSize/3);
                ctx.lineTo(x + iconSize, y + iconSize/3);
                ctx.stroke();
                ctx.strokeStyle = '#5a3d2b';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(x + iconSize/2, y - iconSize/3);
                ctx.lineTo(x + iconSize/6, y + iconSize/4);
                ctx.stroke();
            }

            // Комбо
            if (combo > 1) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255,215,0,0.5)';
                ctx.fillStyle = '#ffd700';
                ctx.font = `bold ${Math.max(16, radius/5)}px 'Segoe UI', sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`🔥 x${combo}`, 20, 60);
            }

            // Подсказка
            if (!flying_knife && !gameOver && !victory) {
                const blink = Math.floor(Date.now() / 800) % 2;
                if (blink) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = `${Math.max(12, radius/7)}px 'Segoe UI', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                    ctx.fillText(isMobile ? '👆 Нажми на экран чтобы бросить' : 'Нажми SPACE или кликни', W()/2, H() - 15);
                }
            }

            ctx.shadowBlur = 0;
        }

        // === Игровая логика ===
        function throwKnife() {
            if (gameOver || victory || flying_knife) return;
            const angle = getSafeAngle();
            flying_knife = { startAngle: angle, progress: 0 };
        }

        function resetGame() {
            knives_on_log = [];
            flying_knife = null;
            score = 0;
            combo = 0;
            gameOver = false;
            victory = false;
            particles = [];
            angle = Math.random() * Math.PI * 2;
            lastHitTime = 0;
            messageEl.classList.remove('show');
            messageEl.textContent = '';
        }

        function update() {
            if (gameOver || victory) return;

            angle += ROTATION_SPEED * (1 + combo * 0.02);

            if (flying_knife) {
                flying_knife.progress += KNIFE_SPEED * (1 + combo * 0.01);
                
                if (flying_knife.progress >= 1) {
                    const newAngle = flying_knife.startAngle;
                    let collision = false;
                    for (const k of knives_on_log) {
                        let diff = Math.abs(k - newAngle);
                        if (diff > Math.PI) diff = Math.PI * 2 - diff;
                        if (diff < 0.3) {
                            collision = true;
                            break;
                        }
                    }

                    if (collision) {
                        gameOver = true;
                        const center = LOG_CENTER();
                        const radius = LOG_RADIUS();
                        const cx = center.x + radius * Math.cos(newAngle + angle);
                        const cy = center.y + radius * Math.sin(newAngle + angle);
                        addParticles(cx, cy, 40, [255, 50, 50]);
                        combo = 0;
                        showMessage('💔 Игра окончена! Нажмите для рестарта', true);
                    } else {
                        knives_on_log.push(newAngle);
                        score++;
                        combo++;
                        lastHitTime = Date.now();
                        const center = LOG_CENTER();
                        const radius = LOG_RADIUS();
                        const cx = center.x + radius * Math.cos(newAngle + angle);
                        const cy = center.y + radius * Math.sin(newAngle + angle);
                        addParticles(cx, cy, 15, [255, 200, 100]);
                        
                        if (score >= MAX_KNIVES) {
                            victory = true;
                            for (let i = 0; i < 5; i++) {
                                setTimeout(() => {
                                    const center = LOG_CENTER();
                                    addParticles(
                                        center.x + (Math.random() - 0.5) * 200,
                                        center.y + (Math.random() - 0.5) * 200,
                                        30,
                                        [255, 215, 0]
                                    );
                                }, i * 150);
                            }
                            showMessage('🎉 ПОБЕДА! Нажмите для рестарта', false);
                        }
                    }
                    flying_knife = null;
                }
            }

            updateParticles();
        }

        function showMessage(text, isError) {
            messageEl.textContent = text;
            messageEl.style.color = isError ? '#ff6b6b' : '#ffd700';
            messageEl.classList.add('show');
            if (messageTimeout) clearTimeout(messageTimeout);
        }

        // === Рендер ===
        function draw() {
            ctx.clearRect(0, 0, W(), H());
            
            drawBackground();
            drawLog();
            
            // Рисуем прицел ПЕРЕД ножами на бревне
            drawAim();

            // Ножи на бревне
            for (let i = 0; i < knives_on_log.length; i++) {
                const k = knives_on_log[i];
                const flash = (i === knives_on_log.length - 1 && 
                              Date.now() - lastHitTime < 200);
                drawKnife(k + angle, false, flash);
            }

            // Летящий нож
            if (flying_knife) {
                drawFlyingKnife(flying_knife.startAngle, flying_knife.progress);
            }

            drawParticles();
            drawUI();

            // Затемнение при Game Over / Victory
            if (gameOver || victory) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.roundRect(0, 0, W(), H(), 20);
                ctx.fill();
            }
        }

        // === Цикл ===
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // === Управление ===
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameOver || victory) {
                    resetGame();
                } else {
                    throwKnife();
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        function handlePointer(e) {
            e.preventDefault();
            if (gameOver || victory) {
                resetGame();
            } else {
                throwKnife();
            }
        }

        canvas.addEventListener('click', handlePointer);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePointer(e);
        }, { passive: false });

        // === Polyfill для roundRect ===
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // === Запуск ===
        resetGame();
        gameLoop();

        window.addEventListener('resize', () => {
            resizeCanvas();
            initStars();
        });

        console.log('🎯 Knife Hit с прицелом!');
        console.log('Управление: Space/Клик/Тап - бросок, R - рестарт');
        console.log('🎯 Маркер показывает откуда прилетит нож');
    </script>
</body>
</html>
