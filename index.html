<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slither.io с ботами</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      touch-action: none;
    }
    body {
      background: #1a2a32;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .game-wrapper {
      background: #2d3f4a;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 650px;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #1f2e38;
      border-radius: 12px;
      touch-action: none;
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: space-around;
      margin-top: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      background: #3a5562;
      border: none;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      font-size: 30px;
      color: white;
      box-shadow: 0 6px 0 #1a2a32;
      transition: 0.05s linear;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .ctrl-btn:active {
      transform: translateY(6px);
      box-shadow: none;
    }
    #scoreDisplay {
      color: #b0d0d0;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 1px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
    }
    #botCount {
      color: #8ab0b0;
      font-size: 0.9rem;
    }
    @media (max-width: 600px) {
      .ctrl-btn {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="status-bar">
    <span id="scoreDisplay">🍎 0</span>
    <span id="botCount">🤖 3</span>
  </div>
  <canvas id="gameCanvas" width="600" height="600"></canvas>
  <div class="controls">
    <button class="ctrl-btn" id="btnLeft">⬅️</button>
    <button class="ctrl-btn" id="btnUp">⬆️</button>
    <button class="ctrl-btn" id="btnDown">⬇️</button>
    <button class="ctrl-btn" id="btnRight">➡️</button>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const botCountSpan = document.getElementById('botCount');

    // ---- Параметры игры ----
    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;
    const BOT_COUNT = 3;
    const MOVE_INTERVAL = 140; // мс

    // ---- Игрок ----
    let player = {
      snake: [
        [10, 10],
        [9, 10],
        [8, 10],
        [7, 10]
      ],
      direction: 'right',
      nextDirection: 'right',
      alive: true,
      score: 0
    };

    // ---- Боты ----
    let bots = [];

    // ---- Еда ----
    let foods = [];

    // ---- Состояние игры ----
    let gameOver = false;
    let gameRunning = false;
    let gameInterval = null;

    // ---- Вспомогательные функции ----
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getCellKey(x, y) {
      return `${x},${y}`;
    }

    function getAllOccupied() {
      const occupied = new Set();
      // Игрок
      player.snake.forEach(seg => occupied.add(getCellKey(seg[0], seg[1])));
      // Боты
      bots.forEach(bot => {
        bot.snake.forEach(seg => occupied.add(getCellKey(seg[0], seg[1])));
      });
      return occupied;
    }

    function generateFood() {
      const occupied = getAllOccupied();
      const totalCells = GRID_SIZE * GRID_SIZE;
      if (occupied.size >= totalCells) return null;

      let attempts = 0;
      while (attempts < 200) {
        const fx = randomInt(0, GRID_SIZE - 1);
        const fy = randomInt(0, GRID_SIZE - 1);
        const key = getCellKey(fx, fy);
        if (!occupied.has(key)) {
          return { x: fx, y: fy };
        }
        attempts++;
      }
      return null;
    }

    function ensureFoodCount(targetCount = 5) {
      while (foods.length < targetCount) {
        const newFood = generateFood();
        if (newFood) {
          foods.push(newFood);
        } else {
          break;
        }
      }
    }

    // ---- Инициализация ботов ----
    function createBot() {
      let startX, startY;
      let attempts = 0;
      const occupied = getAllOccupied();
      do {
        startX = randomInt(2, GRID_SIZE - 3);
        startY = randomInt(2, GRID_SIZE - 3);
        attempts++;
      } while (attempts < 50 && occupied.has(getCellKey(startX, startY)));

      const snake = [
        [startX, startY],
        [startX - 1, startY],
        [startX - 2, startY]
      ];
      
      const dirs = ['up', 'down', 'left', 'right'];
      return {
        snake: snake,
        direction: dirs[randomInt(0, 3)],
        nextDirection: dirs[randomInt(0, 3)],
        alive: true,
        score: 0,
        targetFood: null,
        moveTimer: 0
      };
    }

    function initBots() {
      bots = [];
      for (let i = 0; i < BOT_COUNT; i++) {
        bots.push(createBot());
      }
      botCountSpan.textContent = `🤖 ${bots.length}`;
    }

    // ---- Логика движения (общая для игрока и ботов) ----
    function moveSnakeEntity(entity, isPlayer = false) {
      if (!entity.alive) return false;

      const head = entity.snake[0];
      let newHeadX = head[0];
      let newHeadY = head[1];
      
      // Применяем направление
      entity.direction = entity.nextDirection;
      
      switch (entity.direction) {
        case 'right': newHeadX++; break;
        case 'left':  newHeadX--; break;
        case 'up':    newHeadY--; break;
        case 'down':  newHeadY++; break;
        default: return false;
      }

      // Проверка стен
      if (newHeadX < 0 || newHeadX >= GRID_SIZE || newHeadY < 0 || newHeadY >= GRID_SIZE) {
        entity.alive = false;
        return false;
      }

      const newHead = [newHeadX, newHeadY];
      
      // Проверка столкновения с собой и другими змеями
      const allOccupied = getAllOccupied();
      // Убираем хвост из occupied для проверки (если не едим)
      const willEat = foods.some(f => f.x === newHeadX && f.y === newHeadY);
      
      let collision = false;
      if (willEat) {
        // Проверяем всю змею (кроме головы)
        for (let i = 0; i < entity.snake.length; i++) {
          if (entity.snake[i][0] === newHeadX && entity.snake[i][1] === newHeadY) {
            collision = true;
            break;
          }
        }
        if (!collision) {
          // Проверяем других змей
          const others = isPlayer ? bots : getAllOtherSnakes(entity);
          for (let other of others) {
            for (let seg of other.snake) {
              if (seg[0] === newHeadX && seg[1] === newHeadY) {
                collision = true;
                break;
              }
            }
            if (collision) break;
          }
        }
      } else {
        // Проверяем без хвоста
        const snakeWithoutTail = entity.snake.slice(0, -1);
        for (let i = 0; i < snakeWithoutTail.length; i++) {
          if (snakeWithoutTail[i][0] === newHeadX && snakeWithoutTail[i][1] === newHeadY) {
            collision = true;
            break;
          }
        }
        if (!collision) {
          const others = isPlayer ? bots : getAllOtherSnakes(entity);
          for (let other of others) {
            for (let seg of other.snake) {
              if (seg[0] === newHeadX && seg[1] === newHeadY) {
                collision = true;
                break;
              }
            }
            if (collision) break;
          }
        }
      }

      if (collision) {
        entity.alive = false;
        return false;
      }

      // Движение
      if (willEat) {
        entity.snake = [newHead, ...entity.snake];
        entity.score++;
        // Удаляем съеденную еду
        const foodIndex = foods.findIndex(f => f.x === newHeadX && f.y === newHeadY);
        if (foodIndex !== -1) {
          foods.splice(foodIndex, 1);
        }
        // Генерируем новую еду
        ensureFoodCount();
      } else {
        entity.snake = [newHead, ...entity.snake.slice(0, -1)];
      }

      return true;
    }

    function getAllOtherSnakes(entity) {
      const others = [];
      // Добавляем игрока если это не он
      if (entity !== player) {
        others.push(player);
      }
      // Добавляем ботов кроме текущего
      bots.forEach(bot => {
        if (bot !== entity && bot.alive) {
          others.push(bot);
        }
      });
      return others;
    }

    // ---- ИИ ботов ----
    function updateBotAI(bot) {
      if (!bot.alive) return;

      // Ищем ближайшую еду
      let closestFood = null;
      let minDist = Infinity;
      const head = bot.snake[0];
      
      for (let food of foods) {
        const dist = Math.abs(food.x - head[0]) + Math.abs(food.y - head[1]);
        if (dist < minDist) {
          minDist = dist;
          closestFood = food;
        }
      }

      if (!closestFood) return;

      // Выбираем направление к еде
      const dx = closestFood.x - head[0];
      const dy = closestFood.y - head[1];
      
      // Проверяем возможные направления
      const directions = ['up', 'down', 'left', 'right'];
      const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
      
      // Оцениваем каждое направление
      let bestDir = bot.direction;
      let bestScore = -Infinity;
      
      for (let dir of directions) {
        if (dir === opposites[bot.direction]) continue;
        
        let newX = head[0];
        let newY = head[1];
        switch (dir) {
          case 'right': newX++; break;
          case 'left':  newX--; break;
          case 'up':    newY--; break;
          case 'down':  newY++; break;
        }
        
        // Проверка на столкновение
        if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) continue;
        
        // Проверка на столкновение с другими змеями (упрощённо)
        const allOccupied = getAllOccupied();
        const key = getCellKey(newX, newY);
        // Проверяем, не занята ли клетка (кроме хвоста бота)
        const botTail = bot.snake[bot.snake.length - 1];
        const tailKey = getCellKey(botTail[0], botTail[1]);
        if (key === tailKey) {
          // Можно двигаться на хвост
        } else if (allOccupied.has(key)) {
          continue;
        }
        
        // Оценка направления
        let score = 0;
        // Ближе к еде
        const distToFood = Math.abs(newX - closestFood.x) + Math.abs(newY - closestFood.y);
        score += (20 - distToFood) * 2;
        
        // Предпочитаем направления, где больше пространства
        const freeCells = countFreeCells(newX, newY, bot);
        score += freeCells * 0.5;
        
        if (score > bestScore) {
          bestScore = score;
          bestDir = dir;
        }
      }
      
      bot.nextDirection = bestDir;
    }

    function countFreeCells(x, y, bot) {
      let count = 0;
      const directions = [[0,1],[0,-1],[1,0],[-1,0]];
      const occupied = getAllOccupied();
      // Убираем хвост бота из occupied
      const tail = bot.snake[bot.snake.length - 1];
      const tailKey = getCellKey(tail[0], tail[1]);
      
      for (let [dx, dy] of directions) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
        const key = getCellKey(nx, ny);
        if (!occupied.has(key) || key === tailKey) {
          count++;
        }
      }
      return count;
    }

    // ---- Обновление игры ----
    function updateGame() {
      if (gameOver || !gameRunning) return;

      // Двигаем игрока
      if (player.alive) {
        moveSnakeEntity(player, true);
      }

      // Двигаем ботов
      for (let bot of bots) {
        if (bot.alive) {
          updateBotAI(bot);
          moveSnakeEntity(bot, false);
        }
      }

      // Проверка на game over
      if (!player.alive) {
        gameOver = true;
        stopGame();
      }

      // Удаляем мёртвых ботов
      bots = bots.filter(bot => bot.alive);
      botCountSpan.textContent = `🤖 ${bots.length}`;

      // Если ботов мало - создаём новых
      while (bots.length < BOT_COUNT) {
        const newBot = createBot();
        // Проверяем, не занято ли место
        const occupied = getAllOccupied();
        const headKey = getCellKey(newBot.snake[0][0], newBot.snake[0][1]);
        if (!occupied.has(headKey)) {
          bots.push(newBot);
        } else {
          break;
        }
      }
      botCountSpan.textContent = `🤖 ${bots.length}`;

      // Обновляем счёт
      scoreSpan.textContent = `🍎 ${player.score}`;

      render();
    }

    // ---- Отрисовка ----
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Сетка
      ctx.strokeStyle = '#2e4a5a';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // Рисуем еду
      foods.forEach(food => {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff4d4d';
        ctx.fillStyle = '#ff3b3b';
        ctx.beginPath();
        ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff9f9f';
        ctx.beginPath();
        ctx.arc(food.x * CELL_SIZE + 8, food.y * CELL_SIZE + 8, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // Рисуем ботов
      bots.forEach(bot => {
        if (!bot.alive) return;
        bot.snake.forEach((segment, index) => {
          const [x, y] = segment;
          const isHead = index === 0;
          const color = isHead ? '#5090c8' : '#3a70a0';
          const light = isHead ? '#70b0e0' : '#5090c0';
          const gradient = ctx.createRadialGradient(
            x * CELL_SIZE + 6, y * CELL_SIZE + 6, 2,
            x * CELL_SIZE + 10, y * CELL_SIZE + 10, 12
          );
          gradient.addColorStop(0, light);
          gradient.addColorStop(1, color);
          ctx.fillStyle = gradient;
          ctx.shadowBlur = 6;
          ctx.shadowColor = 'rgba(0,30,60,0.4)';
          ctx.beginPath();
          ctx.roundRect(x * CELL_SIZE + 2, y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
          ctx.fill();
          if (isHead) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 6, y * CELL_SIZE + 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 14, y * CELL_SIZE + 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a2a32';
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 7, y * CELL_SIZE + 5, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 15, y * CELL_SIZE + 5, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      });

      // Рисуем игрока
      if (player.alive) {
        player.snake.forEach((segment, index) => {
          const [x, y] = segment;
          const isHead = index === 0;
          const color = isHead ? '#7ec850' : '#4f9a3a';
          const light = isHead ? '#a8e06e' : '#6bb84a';
          const gradient = ctx.createRadialGradient(
            x * CELL_SIZE + 6, y * CELL_SIZE + 6, 2,
            x * CELL_SIZE + 10, y * CELL_SIZE + 10, 12
          );
          gradient.addColorStop(0, light);
          gradient.addColorStop(1, color);
          ctx.fillStyle = gradient;
          ctx.shadowBlur = 8;
          ctx.shadowColor = 'rgba(0,30,10,0.5)';
          ctx.beginPath();
          ctx.roundRect(x * CELL_SIZE + 2, y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4, 8);
          ctx.fill();
          if (isHead) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 6, y * CELL_SIZE + 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 14, y * CELL_SIZE + 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a2a32';
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 7, y * CELL_SIZE + 5, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x * CELL_SIZE + 15, y * CELL_SIZE + 5, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      ctx.shadowBlur = 0;

      // Game over
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💀 Игра окончена', canvas.width/2, canvas.height/2 - 20);
        ctx.font = '18px Arial';
        ctx.fillText('Нажмите на поле для рестарта', canvas.width/2, canvas.height/2 + 30);
      }
    }

    // ---- Управление ----
    function setDirection(newDir) {
      if (gameOver || !gameRunning || !player.alive) return;
      const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
      if (newDir !== opposites[player.direction]) {
        player.nextDirection = newDir;
      }
    }

    // ---- Запуск / Остановка ----
    function startGame() {
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }
      
      // Сброс
      player.snake = [
        [10, 10],
        [9, 10],
        [8, 10],
        [7, 10]
      ];
      player.direction = 'right';
      player.nextDirection = 'right';
      player.alive = true;
      player.score = 0;
      
      foods = [];
      gameOver = false;
      gameRunning = true;
      
      initBots();
      ensureFoodCount(5);
      render();
      updateScore();
      
      gameInterval = setInterval(() => updateGame(), MOVE_INTERVAL);
    }

    function stopGame() {
      gameRunning = false;
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }
      render();
    }

    function updateScore() {
      scoreSpan.textContent = `🍎 ${player.score}`;
    }

    // ---- Инициализация ----
    window.addEventListener('load', () => {
      // Добавляем roundRect
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          if (r > w/2) r = w/2;
          if (r > h/2) r = h/2;
          this.moveTo(x + r, y);
          this.lineTo(x + w - r, y);
          this.quadraticCurveTo(x + w, y, x + w, y + r);
          this.lineTo(x + w, y + h - r);
          this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          this.lineTo(x + r, y + h);
          this.quadraticCurveTo(x, y + h, x, y + h - r);
          this.lineTo(x, y + r);
          this.quadraticCurveTo(x, y, x + r, y);
          this.closePath();
          return this;
        };
      }

      // Кнопки
      document.getElementById('btnUp').addEventListener('click', (e) => {
        e.preventDefault();
        setDirection('up');
      });
      document.getElementById('btnDown').addEventListener('click', (e) => {
        e.preventDefault();
        setDirection('down');
      });
      document.getElementById('btnLeft').addEventListener('click', (e) => {
        e.preventDefault();
        setDirection('left');
      });
      document.getElementById('btnRight').addEventListener('click', (e) => {
        e.preventDefault();
        setDirection('right');
      });

      // Свайп
      let touchStartX = 0, touchStartY = 0;
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!touchStartX || !touchStartY || gameOver || !gameRunning || !player.alive) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;
        if (Math.abs(deltaX) < 20 && Math.abs(deltaY) < 20) return;

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          setDirection(deltaX > 0 ? 'right' : 'left');
        } else {
          setDirection(deltaY > 0 ? 'down' : 'up');
        }
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        touchStartX = 0;
        touchStartY = 0;
      }, { passive: false });

      // Клик для рестарта
      canvas.addEventListener('click', () => {
        if (gameOver) {
          startGame();
        }
      });

      // Старт
      startGame();
    });
  })();
</script>
</body>
</html>
